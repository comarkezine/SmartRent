{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tenant Login | SmartRent</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{% static 'rental/css/style.css' %}">

</head>

<body class="login-page">

<div class="login-container">

    <div class="login-card">

        <div class="login-logo">
            <i class="bi bi-person"></i>
        </div>

        <h2>Admin Login</h2>

        <p>
            View user records and accounts.
        </p>

        <form method="POST"
              action="{% url 'tenant_login' %}">

            {% csrf_token %}

            <div class="form-group">

                <label>Email Address</label>

                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>

            </div>

{% if login_error %}
    <p style="color: #dc3545; font-size: 14px;">
        {{ login_error }}
    </p>
{% endif %}
            <button type="submit"
                    class="login-submit">

                Login

            </button>

        </form>


        <a href="{% url 'home' %}"
           class="back-home">

            ← Back to Home

        </a>

    </div>

</div>

</body>
</html>
